[package]
name = "pdf-studio"
version = "1.0.3"
description = "PDF Studio: editor de PDF libre"
edition = "2021"
license = "MIT"

[lib]
name = "pdf_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
x509-parser = "0.18"
cryptoki = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "blocking"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
